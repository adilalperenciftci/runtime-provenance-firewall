name: Bounded parser fuzzing

on:
  schedule:
    - cron: "41 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParseEventStream, FuzzDecodePolicy, FuzzDecodeStatement]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - run: go test ./internal/rpf -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=30s
