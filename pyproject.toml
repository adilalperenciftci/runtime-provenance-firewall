[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-boundary"
version = "0.1.0"
description = "Local decision-point security engine for agent tool calls"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = []
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "build==1.6.1",
  "pip-audit==2.10.1",
  "pyright==1.1.414",
  "ruff==0.16.7",
]

[project.scripts]
agent-boundary = "agent_boundary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
